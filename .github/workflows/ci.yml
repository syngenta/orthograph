# Mirror of .gitlab-ci.yml  (lint + security + test only)
# Stages: lint → security → pytest
#
# Trigger rules (match GitLab workflow):
#   - Pull requests targeting any branch  (mirrors merge_request_event)
#   - Pushes to main                       (mirrors CI_COMMIT_BRANCH == "main")
#
# Release is handled separately in release.yml (workflow_dispatch).
#
# All actions are pinned to full commit SHAs (org policy).
# To update a pin: look up the new SHA for the tag and replace below.
#   actions/checkout              v4   => 34e114876b0b11c390a56381ad16ebd13914f8d5
#   actions/setup-python          v5   => a26af69be951a213d495a4c3e4e4022e16d87065
#   actions/upload-artifact       v4   => ea165f8d65b6e75b540449e92b4886f43607fa02
#   gitleaks/gitleaks-action      v2   => ff98106e4c7b2bc287b24eaf42907196329070c7

name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Cancel in-flight runs for the same ref (mirrors `interruptible: true`)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Shared pip cache key tied to pyproject.toml (mirrors GitLab cache key)
env:
  PIP_CACHE_DIR: ~/.cache/pip

# ---------------------------------------------------------------------------
# LINT
# ---------------------------------------------------------------------------
jobs:
  pre-commit:
    name: pre-commit (lint)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: pip install -e '.[dev]'

      - name: Run pre-commit (skip branch-protection hook)
        env:
          SKIP: no-commit-to-branch
        run: pre-commit run --all-files --show-diff-on-failure --color=always

# ---------------------------------------------------------------------------
# SECURITY
# ---------------------------------------------------------------------------
  gitleaks-mr:
    name: gitleaks secret scan (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0          # full history needed by gitleaks

      - name: Scan MR-introduced commits
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        with:
          # Scan only the commits introduced by this PR
          args: >-
            git
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
            --report-format json
            --report-path gitleaks-report.json
            --verbose
            --exit-code 1
            .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: gitleaks-report-pr
          path: gitleaks-report.json
          retention-days: 30

  gitleaks-full:
    name: gitleaks secret scan (full history)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Scan full repository history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        with:
          args: >-
            git
            --report-format json
            --report-path gitleaks-report.json
            --verbose
            --exit-code 1
            .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: gitleaks-report-full
          path: gitleaks-report.json
          retention-days: 30

# ---------------------------------------------------------------------------
# PYTEST  (4-way matrix: 3.11 / 3.12 / 3.13 / 3.14)
# ---------------------------------------------------------------------------
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # run all matrix legs even if one fails
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true   # needed for 3.14
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: pip install -e '.[dev]'

      - name: Run unit tests
        run: python -m pytest -v --junitxml=report.xml

      - name: Run doctests
        run: python -m pytest --doctest-modules src/orthograph -v

      - name: Run notebook regression tests
        run: pytest notebooks/ --nbval-lax -v

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: junit-report-py${{ matrix.python-version }}
          path: report.xml
          retention-days: 7
