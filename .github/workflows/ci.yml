# CI — lint + security + test
#
# Runs on every pull request (feature→dev and dev→main identically).
# All jobs must pass before a PR can be merged (enforce via branch protection rules).
#
# Release is handled separately in release.yml (workflow_dispatch).
#
# All actions are pinned to full commit SHAs (org policy).
# To update a pin: look up the new SHA for the tag and replace below.

# gitleaks: binary installed directly (MIT-licensed, no org license required)
#   binary version pinned via GITLEAKS_VERSION env var

name: CI

on:
  pull_request:

# Cancel in-flight runs for the same PR when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_CACHE_DIR: ~/.cache/pip

# ---------------------------------------------------------------------------
# LINT
# ---------------------------------------------------------------------------
jobs:
  pre-commit:
    name: pre-commit (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: pip install -e '.[dev]'

      - name: Run pre-commit (skip branch-protection hook)
        env:
          SKIP: no-commit-to-branch
        run: pre-commit run --all-files --show-diff-on-failure --color=always

# ---------------------------------------------------------------------------
# SECURITY
# ---------------------------------------------------------------------------
  gitleaks:
    name: gitleaks secret scan (full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.2"   # pin explicitly; bump when updating
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0            # full history required

      - name: Install gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full repository history
        run: >-
          gitleaks git
          --report-format json
          --report-path gitleaks-report.json
          --verbose
          --exit-code 1
          .

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30

# ---------------------------------------------------------------------------
# PYTEST  (4-way matrix: 3.11 / 3.12 / 3.13 / 3.14)
# ---------------------------------------------------------------------------
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # run all matrix legs even if one fails
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true   # needed for 3.14
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: pip install -e '.[dev]'

      - name: Run unit tests
        run: python -m pytest -v --junitxml=report.xml

      - name: Run doctests
        run: python -m pytest --doctest-modules src/orthograph -v

      - name: Run notebook regression tests
        run: pytest notebooks/ --nbval-lax -v

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: junit-report-py${{ matrix.python-version }}
          path: report.xml
          retention-days: 7
