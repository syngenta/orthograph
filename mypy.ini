# Global options:
[mypy]
warn_return_any = True
warn_unused_configs = True
follow_imports = silent
warn_redundant_casts = True
warn_unused_ignores = True
disallow_any_generics = True
no_implicit_reexport = True
disallow_untyped_defs = False
disallow_any_unimported = True
disallow_incomplete_defs = True
check_untyped_defs = True
strict_optional = True

# Plugins and extensions
plugins = pydantic.mypy

# Per-module options:

# Pydantic v2 @computed_field + @property triggers mypy's prop-decorator
# error.  This is a known mypy limitation; the code is correct and tested.
[mypy-orthograph.graph_profile.models]
disable_error_code = prop-decorator

# graphglot ships no PEP 561 stubs, so all types crossing the boundary are Any.
[mypy-orthograph.cypher.parser]
disallow_any_unimported = False
warn_return_any = False

# gqlalchemy ships no PEP 561 stubs, so all types crossing the boundary are Any.
[mypy-orthograph.backends.gqlalchemy.*]
disallow_any_unimported = False
warn_return_any = False

# Disable type checking for specific external packages.
# External libraries
[mypy-networkx.*]
ignore_missing_imports = True

[mypy-graphglot.*]
ignore_missing_imports = True

[mypy-gqlalchemy.*]
ignore_missing_imports = True

[mypy-IPython.*]
ignore_missing_imports = True
