[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
follow_imports = silent
warn_redundant_casts = True
warn_unused_ignores = True
disallow_any_generics = True
no_implicit_reexport = True
disallow_untyped_defs = True
disallow_any_unimported = True
disallow_incomplete_defs = True
check_untyped_defs = True
strict_optional = True
strict = True

plugins = pydantic.mypy

[mypy-orthograph.*]
follow_imports = normal
disallow_untyped_defs = True

[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_any_unimported = False

[mypy-orthograph.extensions.networkx.*]
disallow_any_unimported = False

[mypy-orthograph.extensions.cypher.parser]
disallow_any_unimported = False
warn_return_any = False

# Pydantic v2 @computed_field + @property triggers mypy's prop-decorator
# error.  This is a known mypy limitation; the code is correct and tested.
[mypy-orthograph.extensions.models]
disable_error_code = prop-decorator

[mypy-setuptools.*]
ignore_missing_imports = True

[mypy-networkx.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-graphglot.*]
ignore_missing_imports = True

# IPython is an optional runtime dependency (notebooks extra).  It is imported
# inside a try/except in display_mermaid() so the code is safe without it.
[mypy-IPython.*]
ignore_missing_imports = True
