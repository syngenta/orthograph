[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "orthograph"
version = "0.1.0"
description = "Pydantic-native graph data model definition and validation"
requires-python = ">=3.10"
readme = {file = "README.rst", content-type = "text/x-rst"}
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# --------------------------------------------------------------------------- #
#  Dependencies
# --------------------------------------------------------------------------- #

# Core: the minimum needed to define models, validate data, and load YAML configs
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]

# Extension: NetworkX graph inspection and conversion
networkx = [
    "networkx>=3.0",
]

# Extension: Cypher query parsing and validation (graphglot parser)
cypher = [
    "graphglot>=0.9",
]

# Extension: Neo4j database inspection and result validation
neo4j = [
    "neo4j>=5.0",
]

# Extension: Memgraph database inspection (uses the neo4j Bolt driver)
memgraph = [
    "neo4j>=5.0",
]

# All extensions
all = [
    "orthograph[networkx,cypher,neo4j]",
]

# Extension: Jupyter notebook support (IPython kernel, matplotlib plotting)
notebooks = [
    "jupyter>=1.0",
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
    "matplotlib>=3.7",
]

# Development: testing, linting, type checking
dev = [
    "orthograph[all]",
    "orthograph[notebooks]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.0",
    "ruff>=0.9",
    "mypy>=1.10",
    "pre-commit>=3.0",
    "bumpver>=2023.0",
    "types-PyYAML>=6.0",
    "types-networkx>=3.0",
]

# --------------------------------------------------------------------------- #
#  Packaging
# --------------------------------------------------------------------------- #

[tool.setuptools.packages.find]
where = ["src"]

# --------------------------------------------------------------------------- #
#  Bumpver
# --------------------------------------------------------------------------- #

[tool.bumpver]
current_version = "0.1.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "Bump version {old_version} -> {new_version}"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = ['current_version = "{version}"', 'version = "{version}"']

# --------------------------------------------------------------------------- #
#  Pytest
# --------------------------------------------------------------------------- #

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "slow: marks tests as slow",
]

# --------------------------------------------------------------------------- #
#  Mypy
# --------------------------------------------------------------------------- #

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# IPython is an optional runtime dependency (notebooks extra).  It is imported
# inside a try/except in display_mermaid() so the code is safe without it;
# mypy just needs to know not to error on the missing stubs.
module = "IPython.*"
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
#  Ruff
# --------------------------------------------------------------------------- #

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["notebooks", "build"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
]
ignore = [
    "E203",   # whitespace before ':'
]

[tool.ruff.lint.isort]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
