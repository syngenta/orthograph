[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "orthograph"
version = "0.1.0"
description = "Pydantic-native graph data model definition and validation"
requires-python = ">=3.10"
readme = {file = "README.rst", content-type = "text/x-rst"}
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# --------------------------------------------------------------------------- #
#  Dependencies
# --------------------------------------------------------------------------- #

# Core: the minimum needed to define models, validate data, and load YAML configs
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]

# Backend: NetworkX in-memory graph inspection and conversion
networkx = [
    "networkx>=3.0",
]

# Language tool: Cypher query parsing and validation (graphglot parser)
cypher = [
    "graphglot>=0.9",
]

# Backend: Neo4j database inspection and result validation
neo4j = [
    "neo4j>=5.0",
]

# Backend: Memgraph database inspection (shares the neo4j Bolt driver;
# memgraph speaks Bolt — no separate memgraph Python package required)
memgraph = [
    "neo4j>=5.0",
]

# Backend: GQLAlchemy OGM + query builder integration
gqlalchemy = [
    "gqlalchemy>=1.6",
]

# All extensions (memgraph shares the neo4j driver so no extra dep is pulled in)
all = [
    "orthograph[networkx,cypher,neo4j,memgraph,gqlalchemy]",
]




# Notebook execution in CI (lightweight -- no full Jupyter install)
notebooks = [
    "ipykernel>=6.0",
    "nbval>=0.11",

]

# some notebooks use dependecies that are not required for the code
notebooks_integration_extensions = [
    "fastapi>=0.100",
    "httpx>=0.24",
    "dash>=4.3.0",
    "dash_bootstrap_components>=2.0.0"
]


# Support for documentation generation with Sphinx
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=3.0.0",
]

# Development: testing, linting, type checking
dev = [
    "orthograph[all]",
    "orthograph[docs]",
    "orthograph[notebooks]",
    "orthograph[notebooks_integration_extensions]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.0",
    "ruff>=0.9",
    "mypy>=1.10",
    "pre-commit>=3.0",
    "bumpver>=2023.0",
    "types-PyYAML>=6.0",
    "types-networkx>=3.0",
]

# --------------------------------------------------------------------------- #
#  Packaging
# --------------------------------------------------------------------------- #

[tool.setuptools.packages.find]
where = ["src"]

# --------------------------------------------------------------------------- #
#  Bumpver
# --------------------------------------------------------------------------- #

[tool.bumpver]
current_version = "0.1.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "Bump version {old_version} -> {new_version}"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = ['current_version = "{version}"', 'version = "{version}"']

# --------------------------------------------------------------------------- #
#  Pytest
# --------------------------------------------------------------------------- #

[tool.pytest.ini_options]
testpaths = ["tests", "notebooks"]
addopts = "-v --strict-markers --tb=short --nbval-lax"
markers = [
    "slow: marks tests as slow",
    "neo4j: requires a live Neo4j instance (run with --neo4j)",
    "memgraph: requires a live Memgraph instance (run with --memgraph)",
]

# --------------------------------------------------------------------------- #
#  Ruff
# --------------------------------------------------------------------------- #

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["build"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
]
ignore = [
    "E203",   # whitespace before ':'
]

[tool.ruff.lint.per-file-ignores]
# Notebooks naturally have long data-literal lines; enforcing E501 hurts readability.
"notebooks/*.ipynb" = ["E501"]

[tool.ruff.lint.isort]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
